# ==============================================================================
# Linux Administration & Automation Toolkit Configuration
# File: toolkit.conf
# ==============================================================================

# Backup Configuration
BACKUP_SOURCE_DIRS=("/etc" "/var/www" "/home")
BACKUP_DEST_DIR="/var/backups/admin-toolkit"
BACKUP_RETENTION_DAYS=7
BACKUP_COMPRESSION="gzip"      # gzip or bzip2

# Log Cleanup Configuration
LOG_CLEANUP_TARGETS=("/var/log")
LOG_RETENTION_DAYS=14
VACUUM_JOURNAL_DAYS=14

# Security / Permissions Configuration
DEFAULT_DIR_PERMS="755"
DEFAULT_FILE_PERMS="644"
SECURE_HOME_PERMS="700"

# Notification / Alerting
NOTIFICATION_EMAIL="admin@localhost"
DISK_ALERT_THRESHOLD=85        # Percentage
MEM_ALERT_THRESHOLD=90         # Percentage
